<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HO Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --main:#222222; --soft:#e6e6e6; --deep:#222222; --on-main:#ffffff; --paper:#fffafb;
  --ui-bg:#f7f5f8; --ui-ink:#3a3340; --ui-line:#ddd6e2; --ph:#b9b0bd;
  --font:"Noto Sans KR","Noto Sans JP","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic",sans-serif;
}
html:lang(ja){--font:"Noto Sans JP","Noto Sans KR","Hiragino Sans","Yu Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ui-bg);color:var(--ui-ink);font-family:var(--font);padding:16px}
button,input{font-family:inherit}

/* ---- toolbar ---- */
.bar{max-width:1000px;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
  background:#fff;border:1px solid var(--ui-line);border-radius:16px;padding:10px 12px 10px 18px}
.brand{font-size:17px;margin:0;color:var(--deep);font-weight:900;white-space:nowrap}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--ui-line);cursor:pointer;padding:0;flex:none}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ui-ink)}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(#f4a7b9,#f7e08a,#a8e6cf,#a7d3f4,#c9b6f2,#f4a7b9)}
.sw.custom input{position:absolute;inset:-6px;width:36px;height:36px;opacity:0;cursor:pointer;border:0;padding:0}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sep{width:1px;height:22px;background:var(--ui-line)}
.seg{display:flex;background:var(--ui-bg);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:#8a8190;line-height:1.4}
.seg button.on{background:#fff;color:var(--ui-ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ib{width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--ui-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib:hover:not(:disabled){background:var(--ui-bg)}
.ib:disabled{opacity:.3;cursor:default}
.ib svg{width:18px;height:18px}
.btn{border:1px solid var(--ui-line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;
  color:var(--ui-ink);white-space:nowrap;line-height:1.4}
.btn.on,.btn.primary{background:var(--main);border-color:var(--main);color:var(--on-main);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
/* 드롭다운 메뉴 */
.menu{position:relative}
.menu summary{list-style:none;display:flex;align-items:center;gap:6px}
.menu summary::-webkit-details-marker{display:none}
.menu summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--ui-line);border-radius:12px;padding:6px;
  min-width:190px;box-shadow:0 8px 24px rgba(40,30,45,.12);z-index:15;display:flex;flex-direction:column}
.pop button{border:0;background:none;text-align:left;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ui-ink);white-space:nowrap}
.pop button:hover{background:var(--ui-bg)}
.pop button.danger{color:#b03a4a}
.pop hr{border:0;border-top:1px solid var(--ui-line);margin:4px 6px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;white-space:nowrap;padding:8px 12px}
.check input{accent-color:var(--deep);width:16px;height:16px;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ui-ink);color:#fff;font-size:13px;line-height:1.5;
  padding:10px 18px;border-radius:12px;z-index:20;max-width:calc(100% - 32px);text-align:center}
/* 비밀번호 화면 */
body.locked .bar,body.locked .tip,body.locked .scroller{display:none}
.gate{min-height:80vh;display:flex;align-items:center;justify-content:center}
.gate form{background:#fff;border:1px solid var(--ui-line);border-radius:20px;padding:28px 24px;width:340px;max-width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.gate h1{margin:0;font-size:22px;color:var(--deep);font-weight:900}
.gate p{margin:0;font-size:13px;color:#8a8190;line-height:1.6}
.gate input{border:1px solid var(--ui-line);border-radius:10px;padding:10px 12px;font-size:16px;text-align:center;letter-spacing:.1em}
.gate input:focus{outline:2px solid var(--main);border-color:var(--main)}
.gate .err{color:#b03a4a}
.gate .btn{padding:10px}
.btn:focus-visible,.sw:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.scroller{overflow-x:auto;max-width:1000px;margin:0 auto}
.tip{max-width:1000px;margin:0 auto 14px;padding:0 4px;list-style:none;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;line-height:1.6;color:#6b6270}
.tip li{display:flex;align-items:center;gap:7px}
.tip b{font-size:11.5px;font-weight:700;color:var(--ui-ink);background:#fff;border:1px solid var(--ui-line);border-radius:6px;padding:0 7px}

/* ---- editable text ---- */
.ed{outline:none;cursor:text;overflow-wrap:anywhere;word-break:keep-all}
.ed:empty::before{content:attr(data-ph);color:var(--ph)}
.ed:hover{background:rgba(255,255,255,.35);border-radius:4px}

/* ---- sheet ---- */
#sheet{width:1000px;background:var(--paper);padding:44px 44px 36px;margin:0 auto;color:#2a2530}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;padding-bottom:22px;border-bottom:2px solid var(--main)}
.head-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.eyebrow{align-self:flex-start;background:var(--main);color:var(--on-main);font-size:14px;font-weight:700;letter-spacing:.08em;
  padding:4px 14px;border-radius:999px;line-height:1.5;min-width:60px}
.title{font-size:40px;font-weight:900;line-height:1.25;color:#2a2530;letter-spacing:-.01em}
/* 이름 칸 (라벨 없이 칸만) */
.owner{flex:none;width:240px;align-self:stretch;min-height:84px;background:var(--soft);border-radius:16px;padding:14px 18px;
  display:flex;align-items:center;justify-content:center;text-align:center;position:relative}
.owner .ed{width:100%;font-size:26px;font-weight:900;line-height:1.3;color:#2a2530;min-height:1.3em}
.owner .mini.del{top:-8px;right:-8px}
@media (hover:hover){.owner .mini{opacity:0;transition:opacity .15s}.owner:hover .mini,.owner .mini:focus-visible{opacity:1}}
.addowner{align-self:center;padding:4px 12px;font-size:12px}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 26px}
.chip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--main);border-radius:999px;padding:4px 6px 4px 14px;font-size:14px;font-weight:700;line-height:1.4}
.chip b{background:var(--main);color:var(--on-main);border-radius:999px;min-width:28px;text-align:center;padding:0 8px;font-variant-numeric:tabular-nums}
.chip.top{background:var(--soft)}
.row{margin-bottom:22px}
.tab{display:inline-flex;align-items:center;gap:10px;background:var(--main);color:var(--on-main);border-radius:12px 12px 0 0;
  padding:7px 16px 6px;font-weight:900;position:relative}
.tab .l1,.tab .l2{font-size:20px;line-height:1.3}
.tab .l1{margin-right:-6px;min-width:.5em}
.tab .ed:empty::before{color:currentColor;opacity:.45}
.tab .cnt{font-size:13px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
/* 대문자만 있는 배지: 글자 박스를 대문자 높이로 잘라 위아래를 같게, 마지막 글자 뒤 자간만큼 오른쪽 여백을 줄여 좌우를 같게 */
.tab .most{font-size:11px;font-weight:900;letter-spacing:.06em;background:var(--paper);color:var(--deep);border-radius:999px;
  line-height:1;padding:5px calc(8px - .06em) 5px 8px;text-box:trim-both cap alphabetic}
.cells{background:var(--soft);border-radius:0 14px 14px 14px;padding:18px 16px 14px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:18px 12px;align-items:start}
.cell{display:flex;flex-direction:column;gap:3px;align-items:stretch;position:relative;min-width:0}
.pic{width:100%;aspect-ratio:1;background:var(--paper);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--main);font-size:28px;line-height:1;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.pic{position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
/* 룰 태그: 사진 왼쪽 아래에 붙는 작은 라벨 */
.rule{position:absolute;left:6px;top:6px;background:var(--main);color:var(--on-main);max-width:calc(100% - 12px);border:0;border-radius:999px;padding:2px 8px;
  font-size:10.5px;font-weight:900;line-height:1.5;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rule.add{background:rgba(255,255,255,.92);color:#8a8190;font-weight:700;box-shadow:0 0 0 1px var(--ui-line)}
@media (hover:hover){.cell .rule.add{opacity:0;transition:opacity .15s}.cell:hover .rule.add,.rule.add:focus-visible{opacity:1}}
.rulepop{position:fixed;z-index:16;background:#fff;border:1px solid var(--ui-line);border-radius:14px;padding:12px;width:260px;
  box-shadow:0 8px 24px rgba(40,30,45,.14);display:flex;flex-direction:column;gap:10px}
.rulepop form{display:flex;gap:6px}
.rulepop input{flex:1;min-width:0;border:1px solid var(--ui-line);border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit}
.rulepop .btn{padding:5px 12px}
.rulepop .crow{display:flex;gap:6px;align-items:center}
.rulepop .crow .hex{flex:1;font-family:ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.04em}
.rulepop .crow .hex:invalid{border-color:#b03a4a}
.rulepop .rc{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--ui-line);position:relative;overflow:hidden;cursor:pointer}
.rulepop .rc input{position:absolute;inset:-8px;width:48px;height:48px;border:0;padding:0;cursor:pointer}
.rulepop .foot2{display:flex;justify-content:space-between;gap:8px}
.rulepop .foot2 button{border:0;background:none;font-size:12px;cursor:pointer;padding:2px 0;font-family:inherit;color:#8a8190}
.rulepop .foot2 .del{color:#b03a4a;font-size:12px;cursor:pointer;padding:2px 0;font-family:inherit}
.cap{text-align:center;line-height:1.35;min-height:1.35em}
.cap.scen{font-size:11px;font-weight:700;color:var(--deep);margin-top:4px}
.cap.pc{font-size:14px;font-weight:900;color:#2a2530}
.mini{position:absolute;top:-8px;width:22px;height:22px;border-radius:50%;border:none;
  font-size:12px;line-height:22px;cursor:pointer;padding:0;text-align:center;font-family:Arial,sans-serif}
.mini.del{right:-8px;background:var(--deep);color:#fff}
.mini.crop{right:-8px;top:18px;background:#fff;color:var(--deep);box-shadow:0 0 0 1px var(--ui-line)}
.tab .mini.del{top:-9px;right:-11px}
.rowhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rowhead .btn{margin-bottom:6px;padding:3px 12px;font-size:12px}
@media (hover:hover){
  .cell .mini,.tab .mini{opacity:0;transition:opacity .15s}
  .cell:hover .mini,.tab:hover .mini,.mini:focus-visible{opacity:1}
}
.pic[draggable=true]{cursor:grab}
.cell.dragging{opacity:.4}
.cell.over .pic,.cells.over{outline:2px dashed var(--deep);outline-offset:3px}
.addrow{display:flex;gap:8px;margin:0 0 20px}
.foot{display:flex;justify-content:flex-end;margin-top:8px;font-size:11px;letter-spacing:.08em;color:var(--deep);opacity:.7}

/* export: hide edit UI and placeholders */
.exporting .edit-only{display:none!important}
.exporting .pic.empty{color:transparent}
.exporting .ed:empty::before{content:""}
.exporting .ed:hover{background:none}
.exporting .rule.add{display:none}
.exporting .owner.is-empty{display:none}
.exporting.hide-empty .cell.is-empty,.exporting.hide-empty .row.is-empty{display:none}
/* 빈 칸 빼기를 안 켜도, 저장할 때 빈 칸은 자리만 남기고 줄 배경색으로 보이게 */
.exporting:not(.hide-empty) .cell.is-empty{visibility:hidden}

/* ---- modals ---- */
.modal{position:fixed;inset:0;background:rgba(40,30,45,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.box{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;width:360px;max-width:100%;max-height:100%;overflow-x:hidden;overflow-y:auto}
.box h2{margin:0;font-size:16px;color:var(--ui-ink);font-weight:900}
#cropCv{width:100%;aspect-ratio:1;border-radius:8px;background:#eee;border:1px solid #d9d3dd;box-shadow:0 0 0 3px #f3f0f5;touch-action:none;cursor:grab;display:block}
.box .acts{display:flex;gap:8px;justify-content:flex-end}
.box input[type=range]{width:100%;margin:0;accent-color:var(--deep)}
.hint{font-size:12px;color:#8a8190;margin:0;line-height:1.5}
#result img{max-width:100%;border-radius:8px;display:block}
</style>
</head>
<body class="locked">

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>HO Maker</h1>
    <p>비밀번호를 입력해 주세요<br>パスワードを入力してください</p>
    <input type="password" id="gatePw" aria-label="Password" autofocus>
    <p class="err" id="gateErr" hidden>비밀번호가 달라요 / パスワードが違います</p>
    <button class="btn primary" type="submit">OK</button>
  </form>
</div>

<div class="bar">
  <h1 class="brand" data-t="app"></h1>
  <div class="swatches" id="swatches"></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Language"><button data-lang="ko">한국어</button><button data-lang="ja">日本語</button></div>
    <span class="sep"></span>
    <button class="ib" id="undoBtn" data-tt="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="redoBtn" data-tt="redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <details class="menu"><summary class="btn" data-t="work"></summary>
      <div class="pop">
        <button id="saveProj" data-t="saveProj"></button>
        <button id="loadProj" data-t="loadProj"></button>
        <hr><button id="resetBtn" class="danger" data-t="reset"></button>
      </div></details>
    <details class="menu"><summary class="btn primary" data-t="image"></summary>
      <div class="pop">
        <button id="savePng" data-t="png"></button>
        <button id="saveJpg" data-t="jpg"></button>
        <hr><label class="check"><input type="checkbox" id="hideEmpty"><span data-t="hideEmpty"></span></label>
      </div></details>
  </div>
</div>
<ul class="tip" id="guide"></ul>

<div class="scroller"><div id="sheet"></div></div>

<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="projFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" hidden></div>

<div class="modal" id="cropModal" hidden>
  <div class="box">
    <h2 data-t="crop"></h2>
    <canvas id="cropCv" width="600" height="600"></canvas>
    <p class="hint" data-t="cropHint"></p>
    <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
    <div class="acts">
      <button class="btn" id="cropCancel" data-t="cancel"></button>
      <button class="btn primary" id="cropOk" data-t="ok"></button>
    </div>
  </div>
</div>

<div class="modal" id="resultModal" hidden>
  <div class="box" style="width:520px">
    <h2 data-t="saved"></h2>
    <p class="hint" data-t="savedHint"></p>
    <div id="result"></div>
    <div class="acts"><button class="btn primary" id="resultClose" data-t="close"></button></div>
  </div>
</div>

<script>

  lemon:["#f7e08a","#fffbe3","#6e5a12","#5c4a08"],      mint:["#a8e6cf","#e8faf2","#2e6b55","#245a47"],
  sky:["#a7d3f4","#e6f4fd","#2d5877","#234a66"],        lavender:["#c9b6f2","#f2ecfd","#4d3a7a","#3f2e6a"],

const HEX=/^#[0-9a-f]{6}$/i;
// 저장된 값이나 불러온 파일을 안전한 형태로 맞춤. 형식이 틀리면 null
function normalize(o){
  if(!o||typeof o!=="object"||!Array.isArray(o.rows))return null;
  const str=v=>typeof v==="string"?v:"";
  const okImg=v=>typeof v==="string"&&v.startsWith("data:image/")?v:"";
  return{
    lang:TX[o.lang]?o.lang:"ko",
    theme:(THEMES[o.theme]||(o.theme==="custom"&&HEX.test(o.custom)))?o.theme:"mono",
    custom:HEX.test(o.custom)?o.custom:"#f4a7b9",
    band:typeof o.band==="string"?o.band:null, sub:typeof o.sub==="string"?o.sub:null,
    owner:str(o.owner), showOwner:o.showOwner!==false,
    rows:o.rows.filter(r=>r&&Array.isArray(r.slots)).map(r=>({a:str(r.a),b:str(r.b),
      slots:r.slots.filter(Boolean).map(x=>{
        const sl={img:okImg(x.img),pc:str(x.pc)||str(x.name),scen:str(x.scen),rule:str(x.rule),ruleColor:HEX.test(x.ruleColor)?x.ruleColor:""};
        if(okImg(x.src)){sl.src=x.src;if(x.crop&&isFinite(x.crop.z))sl.crop={z:+x.crop.z,x:+x.crop.x||0,y:+x.crop.y||0}}
        return sl})}))
  };
}

function remember(snap){past.push(snap||clone(S));if(past.length>50)past.shift();future.length=0;updateUndo()}

// 직접 고른 색에서 연한 배경색·진한 글자색을 만들어냄
function deriveTheme(hex){
  const n=parseInt(hex.slice(1),16),R=n>>16,G=n>>8&255,B=n&255;
  const r=R/255,g=G/255,b=B/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,dd=mx-mn;
  let h=0,sat=0;
  if(dd){sat=dd/(1-Math.abs(2*l-1));h=mx===r?((g-b)/dd)%6:mx===g?(b-r)/dd+2:(r-g)/dd+4;h=(h*60+360)%360}
  const s2=Math.round(Math.min(sat*100,55));
  const mix=c=>Math.round(c+(255-c)*.84);
  const lum=(.2126*R+.7152*G+.0722*B)/255;
  return[hex,`rgb(${mix(R)},${mix(G)},${mix(B)})`,`hsl(${Math.round(h)},${s2}%,28%)`,lum>.55?`hsl(${Math.round(h)},${s2}%,22%)`:"#ffffff"];
}
const themeColors=()=>S.theme==="custom"?deriveTheme(S.custom):THEMES[S.theme];
function applyTheme(){
  const [m,s,d,o]=themeColors(),r=document.documentElement.style;
  r.setProperty("--main",m);r.setProperty("--soft",s);r.setProperty("--deep",d);r.setProperty("--on-main",o);
  document.querySelectorAll(".sw[data-th]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.th===S.theme)));
  const cs=document.getElementById("customSw");cs.setAttribute("aria-pressed",String(S.theme==="custom"));cs.title=t("custom");
  document.getElementById("customColor").value=S.custom;
}

function updateTally(){

  const max=Math.max(0,...counts);

    `<span class="chip${counts[i]&&counts[i]===max?" top":""}">${esc((r.a+" "+r.b).trim())}<b>${counts[i]}</b></span>`).join("");
  counts.forEach((c,i)=>{
    const ce=sheet.querySelector(`[data-cnt="${i}"]`);if(ce)ce.textContent=`${c}${t("unit")}`;
    const me=sheet.querySelector(`[data-most="${i}"]`);if(me)me.hidden=!(c&&c===max);
  });
}

function ruleTag(x,ri,si){

let rulePop=null;

function openRulePop(btn,ri,si){

  const sameColor=name=>{for(const r of S.rows)for(const x of r.slots)if(x!==slot&&x.rule===name&&x.ruleColor)return x.ruleColor;return""};
  let pick=curC,touched=false;
  const el=document.createElement("div");el.className="rulepop";

      <input class="hex" id="ruleHex" value="${startC}" maxlength="7" pattern="#?[0-9A-Fa-f]{6}" spellcheck="false" aria-label="HEX">
    </div>
    ${cur?`<div class="foot2"><span></span><button type="button" class="del">${t("ruleDel")}</button></div>`:""}`;
  document.body.appendChild(el);rulePop=el;
  const ci=el.querySelector("#ruleColorInput"),hx=el.querySelector("#ruleHex");
  ci.addEventListener("input",()=>{pick=ci.value;touched=true;hx.value=ci.value.toUpperCase()});
  hx.addEventListener("input",()=>{const v=(hx.value.startsWith("#")?hx.value:"#"+hx.value);if(HEX.test(v)){pick=v.toLowerCase();touched=true;ci.value=pick}});
  const set=(v,c)=>{v=v.trim();if(!v)c="";closeRulePop();if(v===cur&&c===curC)return;remember();slot.rule=v;slot.ruleColor=c;render()};
  const val=()=>el.querySelector("#ruleInput").value;
  el.addEventListener("click",e=>{
    if(e.target.closest(".del"))set("","");
  });
  hx.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();el.querySelector("form").requestSubmit()}});
  el.querySelector("form").addEventListener("submit",e=>{e.preventDefault();const v=val().trim();set(v,touched?pick:(curC||sameColor(v)))});
  const r=btn.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+"px";
  el.style.top=(r.bottom+6+h>innerHeight?Math.max(8,r.top-h-6):r.bottom+6)+"px";
  el.querySelector("#ruleInput").focus();
}

sheet.addEventListener("click",e=>{

function loadImageFile(f){
  if(!f||!f.type.startsWith("image/")){toast(t("notImage"));return}
  const r=new FileReader();
  r.onload=()=>shrink(r.result,1400).then(src=>{pendingSrc=src;openCrop(src,null)},()=>toast(t("notImage")));

/* ---- 끌어다 놓기: 파일 → 사진 칸 / 사진 칸 → 다른 위치 ---- */
let dragFrom=null;
const hasFiles=e=>!!e.dataTransfer&&[...e.dataTransfer.types].includes("Files");
const clearOver=()=>sheet.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));
sheet.addEventListener("dragstart",e=>{
  const p=e.target.closest&&e.target.closest(".pic[draggable=true]");if(!p)return;
  dragFrom={ri:+p.dataset.ri,si:+p.dataset.si};
  e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","ho-slot");
  p.closest(".cell").classList.add("dragging");
});
sheet.addEventListener("dragend",()=>{dragFrom=null;clearOver();sheet.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"))});
function dropTarget(e){
  const c=e.target.closest(".cell[data-si]");
  if(hasFiles(e))return c?{el:c,ri:+c.dataset.ri,si:+c.dataset.si}:null;
  if(!dragFrom)return null;
  if(c)return{el:c,ri:+c.dataset.ri,si:+c.dataset.si};
  const g=e.target.closest(".cells");
  return g?{el:g,ri:+g.dataset.ri,si:S.rows[+g.dataset.ri].slots.length}:null;
}
sheet.addEventListener("dragover",e=>{
  const d=dropTarget(e);if(!d)return;
  e.preventDefault();e.dataTransfer.dropEffect=hasFiles(e)?"copy":"move";
  if(!d.el.classList.contains("over")){clearOver();d.el.classList.add("over")}
});
sheet.addEventListener("dragleave",e=>{if(!sheet.contains(e.relatedTarget))clearOver()});
sheet.addEventListener("drop",e=>{
  const d=dropTarget(e);clearOver();if(!d)return;e.preventDefault();
  if(hasFiles(e)){target={ri:d.ri,si:d.si};loadImageFile(e.dataTransfer.files[0]);return}
  const f=dragFrom;dragFrom=null;
  if(f.ri===d.ri&&f.si===d.si)return;
  remember();
  const item=S.rows[f.ri].slots.splice(f.si,1)[0];
  S.rows[d.ri].slots.splice(Math.min(d.si,S.rows[d.ri].slots.length),0,item);
  render();
});
// 칸 밖에 파일을 떨어뜨려도 브라우저가 파일을 열어버리지 않게
window.addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
window.addEventListener("drop",e=>{if(hasFiles(e))e.preventDefault()});
function shrink(src,max){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));
  const c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.9))};i.onerror=rej;i.src=src})}
function openCrop(src,crop){img=new Image();img.onload=()=>{C=crop?{...crop}:{z:1,x:0,y:0};zoom.value=C.z;if(!crop)center();draw();modal.hidden=false};img.src=src}
function center(){const{w,h}=size();C.x=(cv.width-w)/2;C.y=(cv.height-h)/2}
function size(){const base=cv.width/Math.min(img.width,img.height)*C.z;return{w:img.width*base,h:img.height*base}}
function clamp(){const{w,h}=size();C.x=Math.min(0,Math.max(cv.width-w,C.x));C.y=Math.min(0,Math.max(cv.height-h,C.y));return{w,h}}
function draw(){const{w,h}=clamp();ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,C.x,C.y,w,h)}
zoom.oninput=()=>{const c=cv.width/2,o=C.z;C.z=+zoom.value;C.x=c-(c-C.x)*C.z/o;C.y=c-(c-C.y)*C.z/o;draw()};
let drag=null;
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"};
cv.onpointermove=e=>{if(!drag)return;const k=cv.width/cv.getBoundingClientRect().width;C.x+=(e.clientX-drag.x)*k;C.y+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};draw()};
cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor=""};
cv.addEventListener("wheel",e=>{e.preventDefault();zoom.value=Math.min(4,Math.max(1,C.z-e.deltaY*.002));zoom.oninput()},{passive:false});
function closeCrop(){modal.hidden=true;pendingSrc=null}
document.getElementById("cropCancel").onclick=closeCrop;
document.getElementById("cropOk").onclick=()=>{
  const o=document.createElement("canvas");o.width=o.height=400;
  const{w,h}=clamp(),k=400/cv.width,g=o.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,400,400);g.drawImage(img,C.x*k,C.y*k,w*k,h*k);
  remember();
  const s=S.rows[target.ri].slots[target.si];
  s.img=o.toDataURL("image/jpeg",.92);s.src=pendingSrc||s.src||img.src;s.crop={...C};
  closeCrop();render();
};

/* ---- export ---- */
async function captureSheet(type){
  const mime=type==="png"?"image/png":"image/jpeg";
  if(window.htmlToImage){
    try{
      const o={pixelRatio:2,backgroundColor:"#fffafb",width:sheet.offsetWidth,height:sheet.offsetHeight,style:{margin:"0"},quality:.95};
      return type==="png"?await htmlToImage.toPng(sheet,o):await htmlToImage.toJpeg(sheet,o);
    }catch(err){console.warn("html-to-image failed, falling back",err)}
  }
  if(typeof html2canvas!=="function")throw new Error("no capture library");
  const c=await html2canvas(sheet,{scale:2,backgroundColor:"#fffafb",useCORS:true,windowWidth:sheet.scrollWidth+80,scrollX:0,scrollY:-window.scrollY});
  return c.toDataURL(mime,.95);
}
async function exportImg(type){
  const btn=document.getElementById(type==="png"?"savePng":"saveJpg");btn.textContent=t("exporting");btn.disabled=true;
  document.activeElement&&document.activeElement.blur();
  const filled=x=>!!(x.img||x.pc.trim()||x.scen.trim());
  sheet.querySelectorAll(".cell[data-si]").forEach(c=>c.classList.toggle("is-empty",!filled(S.rows[c.dataset.ri].slots[c.dataset.si])));
  sheet.querySelectorAll(".row").forEach((r,i)=>r.classList.toggle("is-empty",!S.rows[i].slots.some(filled)));
  sheet.classList.toggle("hide-empty",document.getElementById("hideEmpty").checked);
  sheet.classList.add("exporting");
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const url=await captureSheet(type);
    const name=`HO_${safeName()}.${type}`;
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    document.getElementById("result").innerHTML=`<img src="${url}" alt="">`;
    document.getElementById("resultModal").hidden=false;
  }catch(err){toast(t("exportErr"),5000);console.error(err)
  }finally{
    sheet.classList.remove("exporting","hide-empty");btn.disabled=false;btn.textContent=t(type);
  }
}
document.getElementById("savePng").onclick=()=>exportImg("png");
document.getElementById("saveJpg").onclick=()=>exportImg("jpg");
document.getElementById("resultClose").onclick=()=>{document.getElementById("resultModal").hidden=true};

/* ---- 작업 파일 저장/불러오기 ---- */
const safeName=()=>{
  const n=S.showOwner?S.owner.replace(/[\\/:*?"<>|]/g,"").trim():"";if(n)return n;
  const d=new Date(),z=x=>String(x).padStart(2,"0");return`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}`};
document.getElementById("saveProj").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"ho-maker",version:1,savedAt:new Date().toISOString(),state:S})],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`HO_${safeName()}.homaker.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(t("projSaved"));
};
const projFile=document.getElementById("projFile");
document.getElementById("loadProj").onclick=()=>{projFile.value="";projFile.click()};
projFile.onchange=()=>{
  const f=projFile.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let n=null;try{const j=JSON.parse(r.result);n=normalize(j&&j.app==="ho-maker"?j.state:null)}catch(e){}
    if(!n){toast(t("loadErr"));return}
    remember();S=n;render();toast(t("loaded"));
  };
  r.readAsText(f);
};

/* ---- 메뉴: 바깥을 누르거나 항목을 고르면 닫힘 ---- */
document.addEventListener("click",e=>{
  document.querySelectorAll("details.menu[open]").forEach(d=>{
    if(!d.contains(e.target)||e.target.closest(".pop button:not(#resetBtn)"))d.open=false});
});

/* ---- 단축키: 글자 입력 중에는 브라우저 기본 되돌리기를 씀 ---- */
document.getElementById("undoBtn").onclick=undo;
document.getElementById("redoBtn").onclick=redo;
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;
  if(e.target.closest&&e.target.closest(".ed,input"))return;
  const k=e.key.toLowerCase();
  if(k==="z"&&!e.shiftKey){e.preventDefault();undo()}
  else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo()}
});

render();

/* ---- 비밀번호 화면 (SHA-256 해시만 코드에 둠) ---- */
const PW_HASH="8c8138f0a5f6fde305deecd0395d8e08aedbe1cfb356f3f7064b246280b35219";
async function sha256(txt){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function unlock(){document.body.classList.remove("locked");document.getElementById("gate").remove()}
let unlocked=false;try{unlocked=localStorage.getItem("ho-unlock")===PW_HASH}catch(e){}
if(unlocked)unlock();
else document.getElementById("gateForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const h=await sha256(document.getElementById("gatePw").value.trim().toUpperCase());
  if(h===PW_HASH){try{localStorage.setItem("ho-unlock",h)}catch(e){}unlock()}
  else{document.getElementById("gateErr").hidden=false;document.getElementById("gatePw").select()}
});
</script>
